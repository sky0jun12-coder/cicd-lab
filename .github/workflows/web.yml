name: web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP: web                 # 폴더 이름 = 이미지 이름 (미션 1에서는 web)
  TRIVY_VERSION: v0.74.0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 테스트 (nginx 검사)
        run: | 
          docker build -t ${{ env.APP }}:test ${{ env.APP }}
          docker run --rm --add-host api:127.0.0.1 ${{ env.APP }}:test nginx -t

  scan:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 이미지 빌드 (검사용)
        run: docker build -t ${{ env.APP }}:ci ${{ env.APP }}
      # 남이 만든 Action은 태그 대신 커밋 SHA로 고정한다 (태그는 다른 코드로 옮겨 달 수 있다)
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: Trivy 게이트 (고칠 수 있는 HIGH,CRITICAL이 있으면 실패)
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed ${{ env.APP }}:ci

  push:
    needs: scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 이미지 이름 (GHCR는 소문자만)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ env.APP }}" >> "$GITHUB_OUTPUT"
      -  uses: docker/setup-qemu-action@v4        
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 빌드·올리기
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:main
  deploy-dev:
    needs: push
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: dev 매니페스트의 web 태그 바꾸기
        run: |
          yq -i '(.images[] | select(.name == "todo-web")).newTag = strenv(GITHUB_SHA)' \
            deploy/overlays/dev/kustomization.yaml
          git diff
      - name: 커밋·push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/dev/kustomization.yaml
          git diff --cached --quiet && { echo "바뀐 것 없음"; exit 0; }
          git commit -m "deploy(dev): web ${GITHUB_SHA::7}"
          git pull --rebase
          git push
